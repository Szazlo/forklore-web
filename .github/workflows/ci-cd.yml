name: CI/CD Pipeline

on:
 push:
  branches:
   - "*"

jobs:
 build:
  name: Build
  runs-on: ubuntu-latest

  steps:
   - name: Checkout code
     uses: actions/checkout@v4

   - name: Set up Node.js
     uses: actions/setup-node@v4
     with:
      node-version: 22
      cache: "npm"

   - name: Install dependencies
     run: npm ci

   - name: Build app
     run: npm run build
